<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nebula Graph harness</title>
	<style>
		html, body { margin: 0; height: 100%; background: #05070D; overflow: hidden; font: 12px system-ui, sans-serif; }
		#host { position: absolute; inset: 0; }
		#stats { position: absolute; left: 8px; bottom: 8px; color: #9aa3b8; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
		canvas.nebula-graph-canvas { display: block; width: 100%; height: 100%; }
	</style>
</head>
<body>
	<div id="host"></div>
	<div id="stats"></div>
	<script src="bundle.js"></script>
</body>
</html>
