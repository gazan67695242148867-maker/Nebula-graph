name: Release Obsidian plugin

on:
    push:
        # GitHub tag filters are globs, not regexes. The check step below enforces bare x.y.z.
        tags:
            - '*.*.*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Tag '$tag' is not bare x.y.z (no leading 'v')."
                    exit 1
                  fi
                  node scripts/check-version.mjs "$tag"

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Create release
              env:
                  # gh is preinstalled on GitHub-hosted runners and reads GH_TOKEN.
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  # Published, not draft: BRAT and the community directory cannot see drafts.
                  gh release create "$tag" \
                    --title "$tag" \
                    --verify-tag \
                    main.js manifest.json styles.css
